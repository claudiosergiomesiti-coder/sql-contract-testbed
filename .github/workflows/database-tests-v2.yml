name: Database Tests V2
 
on:
  push:
  pull_request:
  workflow_dispatch:
 
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
 
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contract_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pgtap

      - name: Verify connection
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d contract_db \
            -c "SELECT version();"
 
      - name: Build schema
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d contract_db \
            -f sql/bootstrap.sql
 
      - name: Run first pgTAP test
        env:
          PGPASSWORD: postgres
        run: |
          pg_prove \
            -h localhost \
            -U postgres \
            -d contract_db \
            sql/V004__customers_tests.sql
 
      - name: Success marker
        run: |
          echo "Schema built successfully"