name: Test Docker Build

on:
  workflow_dispatch:
  push:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PostgreSQL pgTAP image
        run: |
          docker build -t contract-postgres ./docker

      - name: Verify image
        run: |
          docker images | grep contract-postgres