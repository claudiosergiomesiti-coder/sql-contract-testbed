name: Database Tests

on:
  push:
    branches:
      - master
      - feature/github-pgtap
      - feature/v1.1-reporting
jobs:

  postgres-tests:

    runs-on: ubuntu-latest

    services:

      postgres:

        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contract_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install PostgreSQL Client and pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-client \
            libtap-parser-sourcehandler-pgtap-perl \
            pgtap
      
      - name: Check pgTAP Package
        run: |
          apt-cache search pgtap

      - name: Test Connection
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d contract_db \
            -c "SELECT version();"

      - name: Build Database Schema
        env:
          PGPASSWORD: postgres
        run: |
          echo "Contenido de bootstrap.sql"
          cat sql/bootstrap.sql
          psql \
            -h localhost \
            -U postgres \
            -d contract_db \
            -f sql/bootstrap.sql
      - name: Verify Customers Table
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d contract_db \
            -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_name = 'customers';"
      - name: Run Full Test Suite
        env:
          PGPASSWORD: postgres
        run: |
          mkdir -p artifacts

          pg_prove \
            -h localhost \
            -U postgres \
            -d contract_db \
            sql/V004__customers_tests.sql \
            sql/V005__customers_constraints_tests.sql \
            sql/V007__customers_unique_tests.sql \
            sql/V009__orders_fk_tests.sql \
            sql/V010__customers_data_tests.sql \
            sql/V015__customer_orders_view_tests.sql \
            sql/V017__get_customer_email_function_tests.sql \
            sql/V019__get_customer_total_spent_tests.sql \
            sql/V021__get_customer_order_count_tests.sql \
            sql/V023__get_customer_tier_tests.sql \
            | tee artifacts/pgprove-output.log

      - name: Generate Test Summary
        run: |
          chmod +x scripts/generate-summary.sh
          ./scripts/generate-summary.sh
      - name: Upload Test Summary
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: artifacts/test-summary.json