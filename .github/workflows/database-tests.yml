name: PostgreSQL Container Test
 
on:
  workflow_dispatch:
  push:
 
jobs:
  postgres-test:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Build image
        run: |
          docker build -t contract-postgres ./docker
 
      - name: Start container
        run: |
          docker run -d \
            --name contract-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=contract_db \
            -p 5432:5432 \
            contract-postgres
 
      - name: Wait for PostgreSQL
        run: |
          sleep 20
 
      - name: Verify PostgreSQL
        run: |
          docker exec contract-postgres psql \
            -U postgres \
            -d contract_db \
            -c "SELECT version();"
 
      - name: Create pgTAP extension
        run: |
          docker exec contract-postgres psql \
            -U postgres \
            -d contract_db \
            -c "CREATE EXTENSION IF NOT EXISTS pgtap;"
 
      - name: Copy SQL folder
        run: |
          docker cp ./sql/. contract-postgres:/workspace
 
      - name: Show bootstrap file
        run: |
          docker exec contract-postgres cat /workspace/bootstrap.sql
 
      - name: Show V003 file
        run: |
          docker exec contract-postgres cat /workspace/V003__create_customers.sql
 
      - name: Run bootstrap
        run: |
          docker exec contract-postgres sh -c "
            cd /workspace &&
            psql \
              -U postgres \
              -d contract_db \
              -f bootstrap.sql
          "
 
      - name: Verify customers table
        run: |
          docker exec contract-postgres psql \
            -U postgres \
            -d contract_db \
            -c "\dt"
 
      - name: Run V004 test
        run: |
          docker exec contract-postgres pg_prove \
            -U postgres \
            -d contract_db \
            /workspace/V004__customers_tests.sql

      - name: Run V005 test
        run: |
          docker exec contract-postgres pg_prove \
            -U postgres \
            -d contract_db \
            /workspace/V005__customers_constraints_tests.sql

      - name: Run V007 test
        run: |
          docker exec contract-postgres pg_prove \
            -U postgres \
            -d contract_db \
            /workspace/V007__customers_unique_tests.sql

      - name: Run V009 test
        run: |
          docker exec contract-postgres pg_prove \
            -U postgres \
            -d contract_db \
            /workspace/V009__orders_fk_tests.sql

      - name: Run V010 test
        run: |
          docker exec contract-postgres pg_prove \
            -U postgres \
            -d contract_db \
            /workspace/V010__customers_data_tests.sql

      - name: Run V011 test
        run: |
          docker exec contract-postgres pg_prove \
            -U postgres \
            -d contract_db \
            /workspace/V011__duplicate_email_tests.sql

      - name: Run V012 test
        run: |
          docker exec contract-postgres pg_prove \
            -U postgres \
            -d contract_db \
            /workspace/V012__duplicate_email_exists_test.sql

      - name: Run V013 test
        run: |
          docker exec contract-postgres pg_prove \
            -U postgres \
            -d contract_db \
            /workspace/V013__orders_data_tests.sql

      - name: Run V015 test
        run: |
          docker exec contract-postgres pg_prove \
            -U postgres \
