name: Database Tests

on:
  push:
    branches:
      - master
      - feature/github-pgtap
jobs:

  postgres-tests:

    runs-on: ubuntu-latest

    services:

      postgres:

        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contract_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test Connection
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d contract_db \
            -c "SELECT version();"

      - name: Build Database Schema
        env:
          PGPASSWORD: postgres
        run: |
          echo "Contenido de bootstrap.sql"
          cat sql/bootstrap.sql
          psql \
            -h localhost \
            -U postgres \
            -d contract_db \
            -f sql/bootstrap.sql
      - name: Verify Customers Table
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d contract_db \
            -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_name = 'customers';"
      - name: Run Full Test Suite
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d contract_db \
            -f sql/all-tests.sql
      - name: Generate Test Summary
        run: |
          chmod +x scripts/generate-summary.sh
          ./scripts/generate-summary.sh