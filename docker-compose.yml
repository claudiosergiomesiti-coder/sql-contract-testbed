services:

  postgres:

    build:
      context: ./docker

    container_name: contract-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contract_db

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql:/workspace/sql

volumes:
  postgres-data: